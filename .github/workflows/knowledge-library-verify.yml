name: Knowledge Library verification
on:
  pull_request:
    branches: [inquiry-timeline-staging]
  push:
    branches: [knowledge-library-analytics-2026-11-11]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
